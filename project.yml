name: Stickify
options:
  bundleIdPrefix: com.stickify
  deploymentTarget:
    iOS: "16.0"
packages:
  SDWebImage:
    url: https://github.com/SDWebImage/SDWebImage
    from: 5.19.0
  SDWebImageWebPCoder:
    url: https://github.com/SDWebImage/SDWebImageWebPCoder
    from: 0.14.6
targets:
  Stickify:
    type: application
    platform: iOS
    sources: [Sources]
    dependencies:
      - package: SDWebImage
        product: SDWebImage
      - package: SDWebImageWebPCoder
        product: SDWebImageWebPCoder
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: Stickify
        UILaunchScreen: {}
        LSApplicationQueriesSchemes: [whatsapp]
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSPhotoLibraryUsageDescription: Pick photos and videos to make stickers
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.stickify.app
        SWIFT_VERSION: "5.0"
        MARKETING_VERSION: "1.3"
        CURRENT_PROJECT_VERSION: "4"
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
