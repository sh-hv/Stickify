name: Build IPA
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Create project files
        run: |
          mkdir -p Sources
          cat > project.yml <<'EOF_FILE'
          name: Stickify
          options:
            bundleIdPrefix: com.stickify
            deploymentTarget:
              iOS: "16.0"
          packages:
            SDWebImage:
              url: https://github.com/SDWebImage/SDWebImage
              from: 5.19.0
            SDWebImageWebPCoder:
              url: https://github.com/SDWebImage/SDWebImageWebPCoder
              from: 0.14.6
          targets:
            Stickify:
              type: application
              platform: iOS
              sources: [Sources]
              dependencies:
                - package: SDWebImage
                  product: SDWebImage
                - package: SDWebImageWebPCoder
                  product: SDWebImageWebPCoder
              info:
                path: Sources/Info.plist
                properties:
                  CFBundleDisplayName: Stickify
                  UILaunchScreen: {}
                  LSApplicationQueriesSchemes: [whatsapp]
                  UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
              settings:
                base:
                  PRODUCT_BUNDLE_IDENTIFIER: com.stickify.app
                  SWIFT_VERSION: "5.0"
                  MARKETING_VERSION: "1.0"
                  CURRENT_PROJECT_VERSION: "1"
                  TARGETED_DEVICE_FAMILY: "1"
          EOF_FILE
          cat > Sources/StickifyApp.swift <<'EOF_FILE'
          import SwiftUI
          import UIKit
          import SDWebImage
          import SDWebImageWebPCoder

          struct Sticker: Identifiable {
              let id: String
              let animated: Bool
              let data: Data
              let thumb: UIImage
          }

          final class Store: ObservableObject {
              @Published var stickers: [Sticker] = []
              private let dir: URL = {
                  let d = FileManager.default.urls(for: .documentDirectory, in: .userDomainMask)[0].appendingPathComponent("Stickers")
                  try? FileManager.default.createDirectory(at: d, withIntermediateDirectories: true)
                  return d
              }()

              init() { load() }

              static func thumb(_ data: Data) -> UIImage {
                  let opts: [SDImageCoderOption: Any] = [.decodeFirstFrameOnly: true]
                  return SDImageWebPCoder.shared.decodedImage(with: data, options: opts) ?? UIImage()
              }

              func load() {
                  let files = (try? FileManager.default.contentsOfDirectory(at: dir, includingPropertiesForKeys: nil)) ?? []
                  stickers = files.filter { $0.pathExtension == "webp" }.sorted { $0.lastPathComponent < $1.lastPathComponent }
                      .compactMap { url in
                          guard let d = try? Data(contentsOf: url) else { return nil }
                          return Sticker(id: url.lastPathComponent, animated: url.lastPathComponent.contains(".a."), data: d, thumb: Store.thumb(d))
                      }
              }

              func add(_ data: Data, animated: Bool) {
                  let name = "\(Int(Date().timeIntervalSince1970 * 1000))\(animated ? ".a" : "").webp"
                  try? data.write(to: dir.appendingPathComponent(name))
                  stickers.append(Sticker(id: name, animated: animated, data: data, thumb: Store.thumb(data)))
              }

              func delete(_ s: Sticker) {
                  try? FileManager.default.removeItem(at: dir.appendingPathComponent(s.id))
                  stickers.removeAll { $0.id == s.id }
              }
          }

          enum WhatsApp {
              static func send(_ items: [Sticker], animated: Bool, name: String, publisher: String) -> String? {
                  guard items.count >= 3 else { return "لازم 3 ستيكرات على الأقل (الحد الأقصى 30)" }
                  let list = Array(items.prefix(30))
                  let side: CGFloat = 96
                  let fmt = UIGraphicsImageRendererFormat(); fmt.scale = 1; fmt.opaque = false
                  let tray = UIGraphicsImageRenderer(size: CGSize(width: side, height: side), format: fmt).image { _ in
                      list[0].thumb.draw(in: CGRect(x: 0, y: 0, width: side, height: side))
                  }
                  guard let trayPNG = tray.pngData() else { return "فشل إنشاء أيقونة الحزمة" }
                  let json: [String: Any] = [
                      "identifier": UUID().uuidString,
                      "name": name,
                      "publisher": publisher,
                      "tray_image": trayPNG.base64EncodedString(),
                      "is_animated_sticker_pack": animated,
                      "stickers": list.map { ["image_data": $0.data.base64EncodedString(), "emojis": ["😀"]] as [String: Any] }
                  ]
                  guard let data = try? JSONSerialization.data(withJSONObject: json) else { return "فشل تجهيز البيانات" }
                  UIPasteboard.general.setItems(
                      [["net.whatsapp.third-party.sticker-pack": data]],
                      options: [.localOnly: true, .expirationDate: Date(timeIntervalSinceNow: 60)]
                  )
                  guard let url = URL(string: "whatsapp://stickerPack") else { return nil }
                  UIApplication.shared.open(url) { ok in
                      if !ok { /* واتساب غير مثبت */ }
                  }
                  return nil
              }
          }

          @main
          struct StickifyApp: App {
              @StateObject private var store = Store()
              init() { SDImageCodersManager.shared.addCoder(SDImageWebPCoder.shared) }
              var body: some Scene {
                  WindowGroup {
                      ContentView().environmentObject(store)
                  }
              }
          }
          EOF_FILE
          cat > Sources/Imaging.swift <<'EOF_FILE'
          import UIKit
          import Vision
          import CoreImage
          import ImageIO
          import SDWebImage
          import SDWebImageWebPCoder

          struct Clip {
              var frames: [UIImage]
              var frameDuration: TimeInterval
          }

          enum Effect: String, CaseIterable, Identifiable {
              case bounce = "قفز", shake = "اهتزاز", pulse = "نبض", spin = "دوران", wobble = "تمايل", float = "طفو"
              var id: String { rawValue }

              func transform(_ p: Double) -> (dx: CGFloat, dy: CGFloat, s: CGFloat, a: CGFloat) {
                  let t = p * 2 * Double.pi
                  switch self {
                  case .bounce: return (0, -CGFloat(abs(sin(t))) * 60, 1, 0)
                  case .shake:  return (CGFloat(sin(t * 3)) * 30, 0, 1, 0)
                  case .pulse:  return (0, 0, 1 + 0.15 * CGFloat(sin(t)), 0)
                  case .spin:   return (0, 0, 0.8, CGFloat(t))
                  case .wobble: return (0, 0, 1, CGFloat(sin(t)) * 0.25)
                  case .float:  return (0, CGFloat(sin(t)) * 25, 1 + 0.04 * CGFloat(sin(t)), 0)
                  }
              }

              func frames(_ base: UIImage, count: Int = 20) -> [UIImage] {
                  let fmt = UIGraphicsImageRendererFormat(); fmt.scale = 1; fmt.opaque = false
                  let r = UIGraphicsImageRenderer(size: CGSize(width: 512, height: 512), format: fmt)
                  return (0..<count).map { i in
                      let t = transform(Double(i) / Double(count))
                      return r.image { ctx in
                          let c = ctx.cgContext
                          c.translateBy(x: 256 + t.dx, y: 256 + t.dy)
                          c.rotate(by: t.a)
                          c.scaleBy(x: t.s * 0.8, y: t.s * 0.8)
                          base.draw(in: CGRect(x: -256, y: -256, width: 512, height: 512))
                      }
                  }
              }
          }

          enum Imaging {
              /// يحط الصورة داخل مربع 512x512 شفاف
              static func fit(_ img: UIImage) -> UIImage {
                  let fmt = UIGraphicsImageRendererFormat(); fmt.scale = 1; fmt.opaque = false
                  let s = min(512 / img.size.width, 512 / img.size.height)
                  let w = img.size.width * s, h = img.size.height * s
                  return UIGraphicsImageRenderer(size: CGSize(width: 512, height: 512), format: fmt).image { _ in
                      img.draw(in: CGRect(x: (512 - w) / 2, y: (512 - h) / 2, width: w, height: h))
                  }
              }

              /// حذف الخلفية بالذكاء الاصطناعي (Vision) - يحتاج iOS 17
              static func removeBackground(_ img: UIImage) -> UIImage? {
                  guard #available(iOS 17.0, *), let cg = img.cgImage else { return nil }
                  let req = VNGenerateForegroundInstanceMaskRequest()
                  let handler = VNImageRequestHandler(cgImage: cg)
                  do {
                      try handler.perform([req])
                      guard let obs = req.results?.first else { return nil }
                      let buf = try obs.generateMaskedImage(ofInstances: obs.allInstances, from: handler, croppedToInstancesExtent: false)
                      let ci = CIImage(cvPixelBuffer: buf)
                      guard let out = CIContext().createCGImage(ci, from: ci.extent) else { return nil }
                      return UIImage(cgImage: out)
                  } catch { return nil }
              }

              static func gifClip(_ data: Data) -> Clip? {
                  guard let src = CGImageSourceCreateWithData(data as CFData, nil) else { return nil }
                  let n = CGImageSourceGetCount(src)
                  guard n > 1 else { return nil }
                  let step = max(1, Int(ceil(Double(n) / 40)))
                  var frames: [UIImage] = []
                  var total = 0.0
                  for i in 0..<n {
                      let props = CGImageSourceCopyPropertiesAtIndex(src, i, nil) as? [CFString: Any]
                      let g = props?[kCGImagePropertyGIFDictionary] as? [CFString: Any]
                      let d = (g?[kCGImagePropertyGIFUnclampedDelayTime] as? Double) ?? (g?[kCGImagePropertyGIFDelayTime] as? Double) ?? 0.1
                      total += max(d, 0.02)
                      if i % step == 0, let cg = CGImageSourceCreateImageAtIndex(src, i, nil) {
                          frames.append(fit(UIImage(cgImage: cg)))
                      }
                  }
                  let dur = max(0.04, total / Double(n) * Double(step))
                  return Clip(frames: frames, frameDuration: dur)
              }

              private static func encodeOnce(_ clip: Clip, quality q: Double) -> Data? {
                  let opts: [SDImageCoderOption: Any] = [.encodeCompressionQuality: q]
                  if clip.frames.count > 1 {
                      let fr = clip.frames.map { SDImageFrame(image: $0, duration: clip.frameDuration) }
                      guard let anim = SDImageCoderHelper.animatedImage(with: fr) else { return nil }
                      return SDImageWebPCoder.shared.encodedData(with: anim, format: .webP, options: opts)
                  }
                  return SDImageWebPCoder.shared.encodedData(with: clip.frames[0], format: .webP, options: opts)
              }

              /// يضغط تلقائي: ثابت < 100KB ، متحرك < 500KB (شرط واتساب)
              static func encode(_ clip: Clip) -> Data? {
                  let animated = clip.frames.count > 1
                  let limit = animated ? 500_000 : 100_000
                  for q in [0.85, 0.7, 0.55, 0.4, 0.3, 0.2] {
                      if let d = encodeOnce(clip, quality: q), d.count < limit { return d }
                  }
                  if animated && clip.frames.count > 8 {
                      let half = stride(from: 0, to: clip.frames.count, by: 2).map { clip.frames[$0] }
                      return encode(Clip(frames: half, frameDuration: clip.frameDuration * 2))
                  }
                  return nil
              }
          }
          EOF_FILE
          cat > Sources/Views.swift <<'EOF_FILE'
          import SwiftUI
          import PhotosUI

          struct ContentView: View {
              @EnvironmentObject var store: Store
              @AppStorage("packName") private var packName = "ستيكراتي"
              @AppStorage("publisher") private var publisher = "Stickify"
              @State private var tab = 0
              @State private var showCreator = false
              @State private var message: String?

              var items: [Sticker] { store.stickers.filter { $0.animated == (tab == 1) } }

              var body: some View {
                  NavigationStack {
                      VStack(spacing: 12) {
                          Picker("", selection: $tab) {
                              Text("ثابتة").tag(0)
                              Text("متحركة").tag(1)
                          }.pickerStyle(.segmented).padding(.horizontal)

                          HStack {
                              TextField("اسم الحزمة", text: $packName).textFieldStyle(.roundedBorder)
                              TextField("الناشر", text: $publisher).textFieldStyle(.roundedBorder)
                          }.padding(.horizontal)

                          ScrollView {
                              if items.isEmpty {
                                  Text("ما فيه ستيكرات بعد، اضغط + وسوّي أول واحد")
                                      .foregroundStyle(.secondary).padding(.top, 60)
                              }
                              LazyVGrid(columns: [GridItem(.adaptive(minimum: 90), spacing: 10)], spacing: 10) {
                                  ForEach(items) { s in
                                      Image(uiImage: s.thumb).resizable().scaledToFit()
                                          .padding(6)
                                          .background(Color.gray.opacity(0.15), in: RoundedRectangle(cornerRadius: 12))
                                          .overlay(alignment: .topLeading) {
                                              if s.animated { Text("▶︎").font(.caption2).padding(4) }
                                          }
                                          .contextMenu {
                                              Button("حذف", role: .destructive) { store.delete(s) }
                                          }
                                  }
                              }.padding(.horizontal)
                          }

                          Button {
                              message = WhatsApp.send(items, animated: tab == 1, name: packName, publisher: publisher)
                          } label: {
                              Label("إضافة إلى واتساب (\(items.count))", systemImage: "paperplane.fill")
                                  .frame(maxWidth: .infinity).padding()
                                  .background(Color.green, in: RoundedRectangle(cornerRadius: 14))
                                  .foregroundStyle(.white)
                          }.padding(.horizontal).padding(.bottom, 8)
                      }
                      .navigationTitle("Stickify")
                      .toolbar {
                          ToolbarItem(placement: .topBarLeading) {
                              Button { showCreator = true } label: { Image(systemName: "plus.circle.fill").font(.title2) }
                          }
                      }
                      .sheet(isPresented: $showCreator) { CreatorView() }
                      .alert("تنبيه", isPresented: Binding(get: { message != nil }, set: { if !$0 { message = nil } })) {
                          Button("حسناً", role: .cancel) {}
                      } message: { Text(message ?? "") }
                  }
                  .environment(\.layoutDirection, .rightToLeft)
              }
          }

          enum Mode: String, CaseIterable, Identifiable {
              case still = "ثابت", effect = "تأثير متحرك", gif = "GIF"
              var id: String { rawValue }
          }

          struct CreatorView: View {
              @EnvironmentObject var store: Store
              @Environment(\.dismiss) private var dismiss
              @State private var item: PhotosPickerItem?
              @State private var source: Data?
              @State private var removeBG = true
              @State private var mode: Mode = .still
              @State private var effect: Effect = .bounce
              @State private var clip: Clip?
              @State private var busy = false
              @State private var error: String?

              var body: some View {
                  NavigationStack {
                      VStack(spacing: 14) {
                          ZStack {
                              RoundedRectangle(cornerRadius: 16).fill(Color.gray.opacity(0.15))
                              if busy { ProgressView() }
                              else if let clip {
                                  TimelineView(.animation) { tl in
                                      let n = clip.frames.count
                                      let i = n > 1 ? Int(tl.date.timeIntervalSinceReferenceDate / clip.frameDuration) % n : 0
                                      Image(uiImage: clip.frames[i]).resizable().scaledToFit()
                                  }
                              } else { Text("اختر صورة").foregroundStyle(.secondary) }
                          }.frame(height: 300).padding(.horizontal)

                          PhotosPicker(selection: $item, matching: .images) {
                              Label("اختيار من الاستديو", systemImage: "photo")
                          }

                          Picker("", selection: $mode) {
                              ForEach(Mode.allCases) { Text($0.rawValue).tag($0) }
                          }.pickerStyle(.segmented).padding(.horizontal)

                          if mode != .gif {
                              Toggle("حذف الخلفية بالذكاء الاصطناعي (iOS 17+)", isOn: $removeBG).padding(.horizontal)
                          }
                          if mode == .effect {
                              Picker("التأثير", selection: $effect) {
                                  ForEach(Effect.allCases) { Text($0.rawValue).tag($0) }
                              }.pickerStyle(.segmented).padding(.horizontal)
                          }
                          if let error { Text(error).foregroundStyle(.red).font(.footnote) }
                          Spacer()
                          Button(action: save) {
                              Text("حفظ الستيكر").frame(maxWidth: .infinity).padding()
                                  .background(clip == nil ? Color.gray : Color.blue, in: RoundedRectangle(cornerRadius: 14))
                                  .foregroundStyle(.white)
                          }.disabled(clip == nil || busy).padding(.horizontal)
                      }
                      .navigationTitle("ستيكر جديد")
                      .navigationBarTitleDisplayMode(.inline)
                      .onChange(of: item) { _ in load() }
                      .onChange(of: removeBG) { _ in rebuild() }
                      .onChange(of: mode) { _ in rebuild() }
                      .onChange(of: effect) { _ in rebuild() }
                  }
                  .environment(\.layoutDirection, .rightToLeft)
              }

              func load() {
                  guard let item else { return }
                  Task {
                      if let d = try? await item.loadTransferable(type: Data.self) {
                          source = d
                          rebuild()
                      }
                  }
              }

              func rebuild() {
                  guard let data = source else { return }
                  busy = true; error = nil
                  let rb = removeBG, m = mode, e = effect
                  Task.detached(priority: .userInitiated) {
                      var result: Clip?
                      if m == .gif { result = Imaging.gifClip(data) }
                      if result == nil, let ui = UIImage(data: data) {
                          var base = Imaging.fit(ui)
                          if rb { base = Imaging.removeBackground(base) ?? base }
                          result = m == .effect
                              ? Clip(frames: e.frames(base), frameDuration: 0.05)
                              : Clip(frames: [base], frameDuration: 0.1)
                      }
                      await MainActor.run { clip = result; busy = false }
                  }
              }

              func save() {
                  guard let clip else { return }
                  busy = true
                  Task.detached(priority: .userInitiated) {
                      let d = Imaging.encode(clip)
                      await MainActor.run {
                          busy = false
                          if let d { store.add(d, animated: clip.frames.count > 1); dismiss() }
                          else { error = "الحجم كبير حتى بعد الضغط، جرّب صورة أبسط" }
                      }
                  }
              }
          }
          EOF_FILE
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Build unsigned
        run: |
          xcodebuild -project Stickify.xcodeproj -scheme Stickify -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
      - name: Package IPA
        run: |
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/Stickify.app Payload/
          zip -qry Stickify.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: Stickify-ipa
          path: Stickify.ipa
      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Stickify build ${{ github.run_number }}
          files: Stickify.ipa
