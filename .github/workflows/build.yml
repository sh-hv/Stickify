          struct StickerEditor: View {
              let packID: String
              let animatedPack: Bool
              let source: Source
              @EnvironmentObject var lib: Library
              @Environment(\.dismiss) private var dismiss
              @AppStorage("fps") private var fps = 15

              @State private var original: UIImage?
              @State private var working: UIImage?
              @State private var p = EditParams(S: min(UIScreen.main.bounds.width - 32, 400))
              @State private var removeBG = false
              @State private var effect: Effect = .bounce
              @State private var drawing = false
              @State private var vidDur = 0.0
              @State private var start = 0.0
              @State private var length = 3.0
              @State private var busy = false
              @State private var error: String?
              @State private var pendingData: Data?
              @State private var emojis: [String] = ["😀"]
              @State private var showEmoji = false

              private var isImage: Bool { if case .image = source { return true }; return false }
              private var isVideo: Bool { if case .video = source { return true }; return false }

              var body: some View {
                  NavigationStack {
                      ScrollView {
                          VStack(spacing: 14) {
                              canvas
                              shapeChips
                              if p.shape == .free { lassoControls }
                              zoomRow
                              textRow
                              if isImage { Toggle(tr("حذف الخلفية بالذكاء الاصطناعي (iOS 17+)", "Remove background with AI (iOS 17+)"), isOn: $removeBG) }
                              if isImage && animatedPack { effectRow }
                              if isVideo && vidDur > 0 { videoRow }
                              if let error { Text(error).foregroundStyle(.red).font(.footnote) }
                          }.padding()
                      }
                      .navigationTitle(tr("تعديل الستيكر", "Edit sticker"))
                      .navigationBarTitleDisplayMode(.inline)
                      .toolbar {
                          ToolbarItem(placement: .topBarLeading) {
                              Button(tr("إلغاء", "Cancel")) { dismiss() }
                          }
                          ToolbarItem(placement: .topBarTrailing) {
                              if busy { ProgressView() }
                              else { Button(tr("التالي", "Next"), action: export).disabled(working == nil) }
                          }
                      }
                      .task { await prepare() }
                      .onChange(of: removeBG) { on in toggleBG(on) }
                      .sheet(isPresented: $showEmoji) {
                          EmojiSheet(selection: $emojis, data: pendingData) {
                              if let d = pendingData { lib.addSticker(packID, data: d, emojis: emojis) }
                              showEmoji = false
                              dismiss()
                          }
                      }
                  }
              }

              private var canvas: some View {
                  Group {
                      if let w = working {
                          EditCanvas(image: w, p: $p, drawing: drawing && p.shape == .free)
                      } else {
                          ProgressView().frame(width: p.S, height: p.S)
                      }
                  }
              }

              private var shapeChips: some View {
                  ScrollView(.horizontal, showsIndicators: false) {
                      HStack {
                          ForEach(CropShape.allCases) { s in
                              Button {
                                  p.shape = s
                                  if s != .free { drawing = false }
                              } label: {
                                  Text(s.title).padding(.horizontal, 14).padding(.vertical, 8)
                                      .background(p.shape == s ? Color.accentColor : Color.gray.opacity(0.2), in: Capsule())
                                      .foregroundStyle(p.shape == s ? Color.white : Color.primary)
                              }
                          }
                      }
                  }
              }

              private var lassoControls: some View {
                  HStack {
                      Toggle(tr("ارسم حدود القص بإصبعك", "Draw the cut outline"), isOn: $drawing)
                      Button(tr("مسح", "Clear")) { p.lasso = [] }
                  }
              }

              private var zoomRow: some View {
                  HStack {
                      Image(systemName: "minus.magnifyingglass")
                      Slider(value: $p.scale, in: 0.2...5)
                      Image(systemName: "plus.magnifyingglass")
                      Button { p.scale = 1; p.offset = .zero } label: { Image(systemName: "arrow.counterclockwise") }
                  }
              }

              private var textRow: some View {
                  VStack(spacing: 8) {
                      TextField(tr("أضف نص على الستيكر", "Add text to sticker"), text: $p.text).textFieldStyle(.roundedBorder)
                      if !p.text.isEmpty {
                          HStack {
                              ColorPicker("", selection: $p.textColor).labelsHidden()
                              Slider(value: $p.textSize, in: 24...120)
                          }
                          Text(tr("اسحب النص على الصورة لتحريكه", "Drag the text on the image to move it"))
                              .font(.caption).foregroundStyle(.secondary)
                      }
                  }
              }

              private var effectRow: some View {
                  HStack {
                      Text(tr("تأثير الحركة", "Motion effect"))
                      Spacer()
                      Picker("", selection: $effect) {
                          ForEach(Effect.allCases) { Text($0.title).tag($0) }
                      }.pickerStyle(.menu)
                  }
              }

              private var videoRow: some View {
                  VStack(spacing: 8) {
                      HStack {
                          Text(tr("البداية", "Start")).frame(width: 60, alignment: .leading)
                          Slider(value: $start, in: 0...max(0.1, vidDur - 0.3), onEditingChanged: { e in
                              if !e { Task { await loadPreview() } }
                          })
                          Text(String(format: "%.1fs", start)).font(.caption).frame(width: 44)
                      }
                      HStack {
                          Text(tr("المدة", "Length")).frame(width: 60, alignment: .leading)
                          Slider(value: $length, in: 0.3...max(0.4, min(8, vidDur)))
                          Text(String(format: "%.1fs", length)).font(.caption).frame(width: 44)
                      }
                      Picker("FPS", selection: $fps) {
                          ForEach([10, 15, 20, 24], id: \.self) { Text("\($0) fps").tag($0) }
                      }.pickerStyle(.segmented)
                  }
              }

              private func prepare() async {
                  switch source {
                  case .image(let ui):
                      original = ui; working = ui
                  case .gif(let fr, _):
                      original = fr.first; working = fr.first
                  case .video(let url):
                      let d = (try? await AVURLAsset(url: url).load(.duration)).map { CMTimeGetSeconds($0) } ?? 0
                      vidDur = d.isFinite ? d : 0
                      length = min(6, max(0.5, vidDur))
                      await loadPreview()
                  }
              }

              private func loadPreview() async {
                  guard case .video(let url) = source else { return }
                  let t = start
                  let img = await Task.detached { Imaging.videoFrame(url: url, at: t) }.value
                  original = img
                  working = img
              }

              private func toggleBG(_ on: Bool) {
                  guard let o = original else { return }
                  if !on { working = o; return }
                  busy = true; error = nil
                  Task.detached(priority: .userInitiated) {
                      let m = Imaging.removeBackground(o)
                      await MainActor.run {
                          busy = false
                          if let m { working = m }
                          else { error = tr("حذف الخلفية يحتاج iOS 17 وما لقى عنصر واضح", "Background removal needs iOS 17 and a clear subject") }
                      }
                  }
              }

              private func export() {
                  guard !busy else { return }
                  let params = p
                  busy = true; error = nil
                  let src = source
                  let w = working
                  let eff = effect
                  let animated = animatedPack
                  let fpsV = Double(fps)
                  let st = start
                  let len = min(length, max(0.5, vidDur - start))
                  Task.detached(priority: .userInitiated) {
                      var frames: [UIImage] = []
                      var durs: [Double] = []
                      switch src {
                      case .image:
                          if let w {
                              let base = params.render(w)
                              if animated {
                                  frames = eff.frames(base)
                                  durs = Array(repeating: 0.05, count: frames.count)
                              } else {
                                  frames = [base]; durs = [0.1]
                              }
                          }
                      case .gif(let fr, let d):
                          frames = fr.map { params.render($0) }
                          durs = d
                      case .video(let url):
                          let raw = Imaging.videoFrames(url: url, start: st, length: len, fps: fpsV)
                          frames = raw.map { params.render($0) }
                          durs = Array(repeating: 1.0 / fpsV, count: frames.count)
                      }
                      let data = frames.isEmpty ? nil : Imaging.encode(frames: frames, durations: durs)
                      await MainActor.run {
                          busy = false
                          if let data { pendingData = data; showEmoji = true }
                          else { error = tr("تعذر ضغط الستيكر للحجم المطلوب، جرّب مدة أقصر", "Could not compress to the required size, try a shorter clip") }
                      }
                  }
              }
          }
