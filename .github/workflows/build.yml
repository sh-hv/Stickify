name: Build IPA
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Create project files
        run: |
          mkdir -p Sources tools Sources/Assets.xcassets/AppIcon.appiconset
          cat > project.yml <<'EOF_FILE'
          name: Stickify
          options:
            bundleIdPrefix: com.stickify
            deploymentTarget:
              iOS: "16.0"
          packages:
            SDWebImage:
              url: https://github.com/SDWebImage/SDWebImage
              from: 5.19.0
            SDWebImageWebPCoder:
              url: https://github.com/SDWebImage/SDWebImageWebPCoder
              from: 0.14.6
          targets:
            Stickify:
              type: application
              platform: iOS
              sources: [Sources]
              dependencies:
                - package: SDWebImage
                  product: SDWebImage
                - package: SDWebImageWebPCoder
                  product: SDWebImageWebPCoder
              info:
                path: Sources/Info.plist
                properties:
                  CFBundleDisplayName: Stickify
                  UILaunchScreen: {}
                  LSApplicationQueriesSchemes: [whatsapp]
                  UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
                  NSPhotoLibraryUsageDescription: Pick photos and videos to make stickers
              settings:
                base:
                  PRODUCT_BUNDLE_IDENTIFIER: com.stickify.app
                  SWIFT_VERSION: "5.0"
                  MARKETING_VERSION: "1.2"
                  CURRENT_PROJECT_VERSION: "3"
                  TARGETED_DEVICE_FAMILY: "1"
                  ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
          EOF_FILE
          cat > tools/icon.swift <<'EOF_FILE'
          import CoreGraphics
          import ImageIO
          import Foundation

          let cs = CGColorSpaceCreateDeviceRGB()
          let ctx = CGContext(data: nil, width: 1024, height: 1024, bitsPerComponent: 8, bytesPerRow: 0, space: cs, bitmapInfo: CGImageAlphaInfo.noneSkipLast.rawValue)!
          let cols = [CGColor(red: 0.16, green: 0.82, blue: 0.56, alpha: 1), CGColor(red: 0.10, green: 0.42, blue: 0.95, alpha: 1)] as CFArray
          let grad = CGGradient(colorsSpace: cs, colors: cols, locations: [0, 1])!
          ctx.drawLinearGradient(grad, start: CGPoint(x: 0, y: 1024), end: CGPoint(x: 1024, y: 0), options: [])
          ctx.saveGState()
          ctx.translateBy(x: 512, y: 512)
          ctx.rotate(by: -0.12)
          ctx.setShadow(offset: CGSize(width: 0, height: -24), blur: 40, color: CGColor(gray: 0, alpha: 0.35))
          ctx.setFillColor(CGColor(gray: 1, alpha: 1))
          ctx.addPath(CGPath(roundedRect: CGRect(x: -300, y: -300, width: 600, height: 600), cornerWidth: 150, cornerHeight: 150, transform: nil))
          ctx.fillPath()
          ctx.setShadow(offset: .zero, blur: 0, color: nil)
          let dark = CGColor(red: 0.10, green: 0.12, blue: 0.20, alpha: 1)
          ctx.setFillColor(dark)
          ctx.fillEllipse(in: CGRect(x: -130, y: 40, width: 70, height: 110))
          ctx.fillEllipse(in: CGRect(x: 60, y: 40, width: 70, height: 110))
          ctx.setStrokeColor(dark)
          ctx.setLineWidth(40)
          ctx.setLineCap(.round)
          ctx.addArc(center: CGPoint(x: 0, y: -10), radius: 150, startAngle: CGFloat.pi * 1.15, endAngle: CGFloat.pi * 1.85, clockwise: false)
          ctx.strokePath()
          ctx.restoreGState()
          let img = ctx.makeImage()!
          let url = URL(fileURLWithPath: CommandLine.arguments[1])
          let dest = CGImageDestinationCreateWithURL(url as CFURL, "public.png" as CFString, 1, nil)!
          CGImageDestinationAddImage(dest, img, nil)
          CGImageDestinationFinalize(dest)
          EOF_FILE
          cat > Sources/StickifyApp.swift <<'EOF_FILE'
          import SwiftUI
          import UIKit
          import SDWebImage
          import SDWebImageWebPCoder

          func tr(_ ar: String, _ en: String) -> String {
              (UserDefaults.standard.string(forKey: "lang") ?? "ar") == "ar" ? ar : en
          }

          enum Palette {
              static let colors: [Color] = [.green, .blue, .purple, .pink, .orange, .teal]
              static var current: Color {
                  colors[min(UserDefaults.standard.integer(forKey: "accent"), colors.count - 1)]
              }
          }

          // MARK: - Liquid Glass (iOS 26+) مع بديل شفاف للإصدارات الأقدم

          func glassed<V: View, S: Shape>(_ v: V, _ shape: S, tint: Color?) -> AnyView {
              #if compiler(>=6.2)
              if #available(iOS 26.0, *) {
                  if let tint {
                      return AnyView(v.glassEffect(.regular.tint(tint.opacity(0.7)), in: shape))
                  }
                  return AnyView(v.glassEffect(.regular, in: shape))
              }
              #endif
              if let tint {
                  return AnyView(v.background(.ultraThinMaterial, in: shape).background(tint.opacity(0.5), in: shape))
              }
              return AnyView(v.background(.ultraThinMaterial, in: shape))
          }

          extension View {
              func panel<S: Shape>(_ shape: S, tint: Color? = nil) -> AnyView {
                  if UserDefaults.standard.bool(forKey: "glass") { return glassed(self, shape, tint: tint) }
                  return AnyView(self.background(tint ?? Color.gray.opacity(0.15), in: shape))
              }

              func appBackdrop() -> AnyView {
                  if UserDefaults.standard.bool(forKey: "glass") {
                      return AnyView(
                          self.scrollContentBackground(.hidden)
                              .background(
                                  LinearGradient(colors: [Palette.current.opacity(0.4), Palette.current.opacity(0.08)],
                                                 startPoint: .top, endPoint: .bottom).ignoresSafeArea()
                              )
                      )
                  }
                  return AnyView(self)
              }
          }

          // MARK: - Models

          struct StickerMeta: Codable, Identifiable, Hashable {
              var id: String
              var emojis: [String]
          }

          struct PackMeta: Codable, Identifiable {
              var id: String
              var name: String
              var publisher: String
              var animated: Bool
              var stickers: [StickerMeta]
          }

          final class Library: ObservableObject {
              @Published var packs: [PackMeta] = []
              let root: URL
              private let cache = NSCache<NSString, UIImage>()

              init() {
                  let d = FileManager.default.urls(for: .documentDirectory, in: .userDomainMask)[0].appendingPathComponent("StickifyLib")
                  try? FileManager.default.createDirectory(at: d, withIntermediateDirectories: true)
                  root = d
                  if let data = try? Data(contentsOf: d.appendingPathComponent("packs.json")),
                     let p = try? JSONDecoder().decode([PackMeta].self, from: data) { packs = p }
              }

              func persist() {
                  if let d = try? JSONEncoder().encode(packs) {
                      try? d.write(to: root.appendingPathComponent("packs.json"))
                  }
              }

              func url(_ sid: String) -> URL { root.appendingPathComponent(sid + ".webp") }

              func data(_ sid: String) -> Data? { try? Data(contentsOf: url(sid)) }

              func writeSticker(_ sid: String, _ data: Data) {
                  try? data.write(to: url(sid))
                  cache.removeObject(forKey: sid as NSString)
              }

              func thumb(_ sid: String) -> UIImage {
                  if let c = cache.object(forKey: sid as NSString) { return c }
                  guard let d = data(sid) else { return UIImage() }
                  let opts: [SDImageCoderOption: Any] = [.decodeFirstFrameOnly: true]
                  let img = SDImageWebPCoder.shared.decodedImage(with: d, options: opts) ?? UIImage()
                  cache.setObject(img, forKey: sid as NSString)
                  return img
              }

              func addPack(name: String, publisher: String, animated: Bool) -> String {
                  let p = PackMeta(id: UUID().uuidString, name: name, publisher: publisher, animated: animated, stickers: [])
                  packs.append(p)
                  persist()
                  return p.id
              }

              func rename(_ id: String, name: String) {
                  guard let i = packs.firstIndex(where: { $0.id == id }) else { return }
                  packs[i].name = name
                  persist()
              }

              func deletePack(_ id: String) {
                  guard let i = packs.firstIndex(where: { $0.id == id }) else { return }
                  for s in packs[i].stickers { try? FileManager.default.removeItem(at: url(s.id)) }
                  packs.remove(at: i)
                  persist()
              }

              func deleteAll() {
                  for p in packs { for s in p.stickers { try? FileManager.default.removeItem(at: url(s.id)) } }
                  packs = []
                  persist()
              }

              func addSticker(_ packID: String, data: Data, emojis: [String]) {
                  guard let i = packs.firstIndex(where: { $0.id == packID }) else { return }
                  let sid = UUID().uuidString
                  writeSticker(sid, data)
                  packs[i].stickers.append(StickerMeta(id: sid, emojis: emojis))
                  persist()
              }

              func setEmojis(_ packID: String, _ sid: String, _ emojis: [String]) {
                  guard let i = packs.firstIndex(where: { $0.id == packID }),
                        let j = packs[i].stickers.firstIndex(where: { $0.id == sid }) else { return }
                  packs[i].stickers[j].emojis = emojis
                  persist()
              }

              func deleteSticker(_ packID: String, _ sid: String) {
                  guard let i = packs.firstIndex(where: { $0.id == packID }) else { return }
                  try? FileManager.default.removeItem(at: url(sid))
                  packs[i].stickers.removeAll { $0.id == sid }
                  persist()
              }
          }

          // MARK: - WhatsApp

          enum WhatsApp {
              static func send(_ pack: PackMeta, lib: Library) -> String? {
                  guard pack.stickers.count >= 3 else {
                      return tr("لازم 3 ستيكرات على الأقل (الحد الأقصى 30)", "You need at least 3 stickers (max 30)")
                  }
                  guard let wa = URL(string: "whatsapp://stickerPack"), UIApplication.shared.canOpenURL(wa) else {
                      return tr("واتساب غير مثبت على الجهاز", "WhatsApp is not installed")
                  }
                  let list = Array(pack.stickers.prefix(30))
                  let side: CGFloat = 96
                  let fmt = UIGraphicsImageRendererFormat(); fmt.scale = 1; fmt.opaque = false
                  let first = lib.thumb(list[0].id)
                  let tray = UIGraphicsImageRenderer(size: CGSize(width: side, height: side), format: fmt).image { _ in
                      first.draw(in: CGRect(x: 0, y: 0, width: side, height: side))
                  }
                  guard let trayPNG = tray.pngData() else { return tr("فشل إنشاء أيقونة الحزمة", "Failed to create tray icon") }
                  var items: [[String: Any]] = []
                  for s in list {
                      guard let d = lib.data(s.id) else { continue }
                      let em = s.emojis.isEmpty ? ["😀"] : [s.emojis[0]]
                      items.append(["image_data": d.base64EncodedString(), "emojis": em])
                  }
                  let json: [String: Any] = [
                      "identifier": pack.id + "." + String(list.count),
                      "name": pack.name,
                      "publisher": pack.publisher,
                      "tray_image": trayPNG.base64EncodedString(),
                      "is_animated_sticker_pack": pack.animated,
                      "animated_sticker_pack": pack.animated,
                      "stickers": items
                  ]
                  guard let data = try? JSONSerialization.data(withJSONObject: json) else {
                      return tr("فشل تجهيز البيانات", "Failed to prepare data")
                  }
                  UIPasteboard.general.setItems(
                      [["net.whatsapp.third-party.sticker-pack": data]],
                      options: [.localOnly: true, .expirationDate: Date(timeIntervalSinceNow: 60)]
                  )
                  UIApplication.shared.open(wa)
                  return nil
              }
          }

          @main
          struct StickifyApp: App {
              @StateObject private var lib = Library()
              @AppStorage("lang") private var lang = "ar"
              @AppStorage("theme") private var theme = 0
              @AppStorage("accent") private var accent = 0
              @AppStorage("glass") private var glass = false

              init() { SDImageCodersManager.shared.addCoder(SDImageWebPCoder.shared) }

              var body: some Scene {
                  WindowGroup {
                      HomeView()
                          .id("\(lang)-\(glass)-\(accent)")
                          .environmentObject(lib)
                          .environment(\.layoutDirection, lang == "ar" ? .rightToLeft : .leftToRight)
                          .tint(Palette.colors[min(accent, Palette.colors.count - 1)])
                          .preferredColorScheme(theme == 1 ? .light : (theme == 2 ? .dark : nil))
                  }
              }
          }
          EOF_FILE
          cat > Sources/Backup.swift <<'EOF_FILE'
          import SwiftUI
          import UIKit
          import Compression

          // قارئ وكاتب ZIP بسيط (الكتابة بدون ضغط لأن WebP مضغوط أصلاً، والقراءة تدعم stored و deflate)
          enum Zip {
              static let crcTable: [UInt32] = (0..<256).map { i -> UInt32 in
                  var c = UInt32(i)
                  for _ in 0..<8 { c = (c & 1) != 0 ? (0xEDB88320 ^ (c >> 1)) : (c >> 1) }
                  return c
              }

              static func crc32(_ data: Data) -> UInt32 {
                  var c: UInt32 = 0xFFFFFFFF
                  for b in data { c = crcTable[Int((c ^ UInt32(b)) & 0xFF)] ^ (c >> 8) }
                  return c ^ 0xFFFFFFFF
              }

              static func write(entries: [(name: String, data: Data)]) -> Data {
                  var out = Data()
                  var central = Data()
                  for e in entries {
                      let name = Data(e.name.utf8)
                      let crc = crc32(e.data)
                      let offset = UInt32(out.count)
                      let size = UInt32(e.data.count)
                      out.le32(0x04034b50); out.le16(20); out.le16(0x0800); out.le16(0)
                      out.le16(0); out.le16(0x21)
                      out.le32(crc); out.le32(size); out.le32(size)
                      out.le16(UInt16(name.count)); out.le16(0)
                      out.append(name); out.append(e.data)
                      central.le32(0x02014b50); central.le16(20); central.le16(20); central.le16(0x0800); central.le16(0)
                      central.le16(0); central.le16(0x21)
                      central.le32(crc); central.le32(size); central.le32(size)
                      central.le16(UInt16(name.count)); central.le16(0); central.le16(0); central.le16(0); central.le16(0)
                      central.le32(0); central.le32(offset)
                      central.append(name)
                  }
                  let cdOffset = UInt32(out.count)
                  out.append(central)
                  out.le32(0x06054b50); out.le16(0); out.le16(0)
                  out.le16(UInt16(entries.count)); out.le16(UInt16(entries.count))
                  out.le32(UInt32(central.count)); out.le32(cdOffset); out.le16(0)
                  return out
              }

              static func read(_ d: Data) -> [String: Data]? {
                  let bytes = [UInt8](d)
                  func u16(_ o: Int) -> Int { Int(bytes[o]) | (Int(bytes[o + 1]) << 8) }
                  func u32(_ o: Int) -> Int { u16(o) | (u16(o + 2) << 16) }
                  guard bytes.count >= 22 else { return nil }
                  var eocd = -1
                  var i = bytes.count - 22
                  let lowest = max(0, bytes.count - 22 - 65535)
                  while i >= lowest {
                      if u32(i) == 0x06054b50 { eocd = i; break }
                      i -= 1
                  }
                  guard eocd >= 0 else { return nil }
                  let count = u16(eocd + 10)
                  var p = u32(eocd + 16)
                  var result: [String: Data] = [:]
                  for _ in 0..<count {
                      guard p + 46 <= bytes.count, u32(p) == 0x02014b50 else { return nil }
                      let method = u16(p + 10)
                      let csize = u32(p + 20)
                      let usize = u32(p + 24)
                      let nlen = u16(p + 28), elen = u16(p + 30), clen = u16(p + 32)
                      let lho = u32(p + 42)
                      guard p + 46 + nlen <= bytes.count else { return nil }
                      let name = String(decoding: bytes[(p + 46)..<(p + 46 + nlen)], as: UTF8.self)
                      p += 46 + nlen + elen + clen
                      guard lho + 30 <= bytes.count else { return nil }
                      let ds = lho + 30 + u16(lho + 26) + u16(lho + 28)
                      guard ds + csize <= bytes.count else { return nil }
                      let comp = Data(bytes[ds..<(ds + csize)])
                      if method == 0 {
                          result[name] = comp
                      } else if method == 8 {
                          guard let inflated = inflate(comp, usize) else { return nil }
                          result[name] = inflated
                      } else { return nil }
                  }
                  return result
              }

              static func inflate(_ d: Data, _ size: Int) -> Data? {
                  if size == 0 { return Data() }
                  var out = Data(count: size)
                  let n = out.withUnsafeMutableBytes { (dst: UnsafeMutableRawBufferPointer) -> Int in
                      d.withUnsafeBytes { (src: UnsafeRawBufferPointer) -> Int in
                          compression_decode_buffer(
                              dst.bindMemory(to: UInt8.self).baseAddress!, size,
                              src.bindMemory(to: UInt8.self).baseAddress!, d.count,
                              nil, COMPRESSION_ZLIB)
                      }
                  }
                  return n == size ? out : nil
              }
          }

          extension Data {
              mutating func le16(_ v: UInt16) {
                  append(UInt8(v & 0xFF)); append(UInt8(v >> 8))
              }
              mutating func le32(_ v: UInt32) {
                  for i in 0..<4 { append(UInt8((v >> (8 * UInt32(i))) & 0xFF)) }
              }
          }

          extension Library {
              /// نسخة احتياطية لكل الحزم في ملف ZIP واحد
              func makeBackup() -> URL? {
                  guard let idx = try? JSONEncoder().encode(packs) else { return nil }
                  var entries: [(name: String, data: Data)] = [("packs.json", idx)]
                  for p in packs {
                      for s in p.stickers {
                          if let d = data(s.id) { entries.append((s.id + ".webp", d)) }
                      }
                  }
                  let zip = Zip.write(entries: entries)
                  let f = DateFormatter()
                  f.dateFormat = "yyyy-MM-dd"
                  let url = FileManager.default.temporaryDirectory.appendingPathComponent("Stickify-backup-\(f.string(from: Date())).zip")
                  do { try zip.write(to: url); return url } catch { return nil }
              }

              /// استرجاع: يضيف الحزم الجديدة ويستبدل اللي لها نفس المعرّف. يرجع عدد الحزم أو nil لو الملف غير صالح
              func restore(_ zip: Data) -> Int? {
                  guard let files = Zip.read(zip),
                        let idx = files["packs.json"],
                        let incoming = try? JSONDecoder().decode([PackMeta].self, from: idx) else { return nil }
                  var n = 0
                  for var p in incoming {
                      p.stickers = p.stickers.filter { files[$0.id + ".webp"] != nil }
                      for s in p.stickers {
                          if let d = files[s.id + ".webp"] { writeSticker(s.id, d) }
                      }
                      if let i = packs.firstIndex(where: { $0.id == p.id }) { packs[i] = p } else { packs.append(p) }
                      n += 1
                  }
                  persist()
                  return n
              }
          }

          struct ShareItem: Identifiable {
              let id = UUID()
              let url: URL
          }

          struct ShareSheet: UIViewControllerRepresentable {
              let url: URL
              func makeUIViewController(context: Context) -> UIActivityViewController {
                  UIActivityViewController(activityItems: [url], applicationActivities: nil)
              }
              func updateUIViewController(_ vc: UIActivityViewController, context: Context) {}
          }
          EOF_FILE
          cat > Sources/Imaging.swift <<'EOF_FILE'
          import UIKit
          import Vision
          import CoreImage
          import ImageIO
          import AVFoundation
          import SDWebImage
          import SDWebImageWebPCoder

          enum Effect: String, CaseIterable, Identifiable {
              case bounce, shake, pulse, spin, wobble, float
              var id: String { rawValue }
              var title: String {
                  switch self {
                  case .bounce: return tr("قفز", "Bounce")
                  case .shake: return tr("اهتزاز", "Shake")
                  case .pulse: return tr("نبض", "Pulse")
                  case .spin: return tr("دوران", "Spin")
                  case .wobble: return tr("تمايل", "Wobble")
                  case .float: return tr("طفو", "Float")
                  }
              }

              func transform(_ p: Double) -> (dx: CGFloat, dy: CGFloat, s: CGFloat, a: CGFloat) {
                  let t = p * 2 * Double.pi
                  switch self {
                  case .bounce: return (0, -CGFloat(abs(sin(t))) * 60, 1, 0)
                  case .shake:  return (CGFloat(sin(t * 3)) * 30, 0, 1, 0)
                  case .pulse:  return (0, 0, 1 + 0.15 * CGFloat(sin(t)), 0)
                  case .spin:   return (0, 0, 0.8, CGFloat(t))
                  case .wobble: return (0, 0, 1, CGFloat(sin(t)) * 0.25)
                  case .float:  return (0, CGFloat(sin(t)) * 25, 1 + 0.04 * CGFloat(sin(t)), 0)
                  }
              }

              func frames(_ base: UIImage, count: Int = 20) -> [UIImage] {
                  let fmt = UIGraphicsImageRendererFormat(); fmt.scale = 1; fmt.opaque = false
                  let r = UIGraphicsImageRenderer(size: CGSize(width: 512, height: 512), format: fmt)
                  return (0..<count).map { i in
                      let t = transform(Double(i) / Double(count))
                      return r.image { ctx in
                          let c = ctx.cgContext
                          c.translateBy(x: 256 + t.dx, y: 256 + t.dy)
                          c.rotate(by: t.a)
                          c.scaleBy(x: t.s * 0.8, y: t.s * 0.8)
                          base.draw(in: CGRect(x: -256, y: -256, width: 512, height: 512))
                      }
                  }
              }
          }

          /// فحص بنية ملف WebP حسب شروط واتساب
          enum WebPInfo {
              struct Report {
                  var width = 0
                  var height = 0
                  var animated = false
                  var frames = 0
                  var minDur = Int.max
                  var totalMs = 0
              }

              static func inspect(_ d: Data) -> Report? {
                  let b = [UInt8](d)
                  guard b.count > 20,
                        String(decoding: b[0..<4], as: UTF8.self) == "RIFF",
                        String(decoding: b[8..<12], as: UTF8.self) == "WEBP" else { return nil }
                  func le(_ o: Int, _ n: Int) -> Int {
                      var v = 0
                      for i in 0..<n { v |= Int(b[o + i]) << (8 * i) }
                      return v
                  }
                  var r = Report()
                  var p = 12
                  while p + 8 <= b.count {
                      let tag = String(decoding: b[p..<(p + 4)], as: UTF8.self)
                      let size = le(p + 4, 4)
                      let body = p + 8
                      if tag == "VP8X", body + 10 <= b.count {
                          r.animated = (b[body] & 0x02) != 0
                          r.width = le(body + 4, 3) + 1
                          r.height = le(body + 7, 3) + 1
                      } else if tag == "ANMF", body + 16 <= b.count {
                          r.frames += 1
                          let dur = le(body + 12, 3)
                          r.minDur = min(r.minDur, dur)
                          r.totalMs += dur
                      }
                      p = body + size + (size & 1)
                  }
                  return r
              }

              /// يرجع نص تحذير لو فيه مخالفة، أو nil لو كل شي تمام
              static func warning(_ d: Data, animated: Bool) -> String? {
                  guard let r = inspect(d) else { return tr("ملف WebP غير صالح", "Invalid WebP file") }
                  if animated {
                      if d.count > 500_000 { return tr("الحجم أكبر من 500KB", "Size is over 500KB") }
                      if !r.animated || r.frames < 2 { return tr("الملف ليس متحركاً", "File is not animated") }
                      if r.width != 512 || r.height != 512 { return tr("الأبعاد ليست 512×512", "Size is not 512×512") }
                      if r.minDur < 8 { return tr("مدة فريم أقل من 8ms", "Frame duration under 8ms") }
                      if r.totalMs > 10_000 { return tr("المدة أطول من 10 ثواني", "Longer than 10 seconds") }
                  } else {
                      if d.count > 100_000 { return tr("الحجم أكبر من 100KB", "Size is over 100KB") }
                      if r.width != 0 && (r.width != 512 || r.height != 512) { return tr("الأبعاد ليست 512×512", "Size is not 512×512") }
                  }
                  return nil
              }
          }

          enum Imaging {
              static let videoFPS: Double = 15
              static let maxSeconds: Double = 10

              static func normalize(_ img: UIImage, maxDim: CGFloat = 1280) -> UIImage {
                  let s = min(1, maxDim / max(img.size.width, img.size.height))
                  let size = CGSize(width: img.size.width * s, height: img.size.height * s)
                  let fmt = UIGraphicsImageRendererFormat(); fmt.scale = 1; fmt.opaque = false
                  return UIGraphicsImageRenderer(size: size, format: fmt).image { _ in
                      img.draw(in: CGRect(origin: .zero, size: size))
                  }
              }

              static func removeBackground(_ img: UIImage) -> UIImage? {
                  guard #available(iOS 17.0, *), let cg = img.cgImage else { return nil }
                  let req = VNGenerateForegroundInstanceMaskRequest()
                  let handler = VNImageRequestHandler(cgImage: cg)
                  do {
                      try handler.perform([req])
                      guard let obs = req.results?.first else { return nil }
                      let buf = try obs.generateMaskedImage(ofInstances: obs.allInstances, from: handler, croppedToInstancesExtent: false)
                      let ci = CIImage(cvPixelBuffer: buf)
                      guard let out = CIContext().createCGImage(ci, from: ci.extent) else { return nil }
                      return UIImage(cgImage: out)
                  } catch { return nil }
              }

              /// فريمات GIF كلها (بحد أقصى 10 ثواني)
              static func gifFrames(_ data: Data) -> (frames: [UIImage], delays: [Double])? {
                  guard let src = CGImageSourceCreateWithData(data as CFData, nil) else { return nil }
                  let n = CGImageSourceGetCount(src)
                  guard n > 1 else { return nil }
                  var frames: [UIImage] = []
                  var delays: [Double] = []
                  var total = 0.0
                  let opts: [CFString: Any] = [
                      kCGImageSourceCreateThumbnailFromImageAlways: true,
                      kCGImageSourceCreateThumbnailWithTransform: true,
                      kCGImageSourceThumbnailMaxPixelSize: 512
                  ]
                  for i in 0..<n {
                      guard let cg = CGImageSourceCreateThumbnailAtIndex(src, i, opts as CFDictionary) else { continue }
                      let props = CGImageSourceCopyPropertiesAtIndex(src, i, nil) as? [CFString: Any]
                      let g = props?[kCGImagePropertyGIFDictionary] as? [CFString: Any]
                      let d = max(0.02, (g?[kCGImagePropertyGIFUnclampedDelayTime] as? Double) ?? (g?[kCGImagePropertyGIFDelayTime] as? Double) ?? 0.1)
                      if total + d > maxSeconds { break }
                      total += d
                      frames.append(UIImage(cgImage: cg))
                      delays.append(d)
                  }
                  return frames.count > 1 ? (frames, delays) : nil
              }

              static func videoFrame(url: URL, at t: Double, maxSize: CGFloat = 160) -> UIImage? {
                  let gen = AVAssetImageGenerator(asset: AVURLAsset(url: url))
                  gen.appliesPreferredTrackTransform = true
                  gen.maximumSize = CGSize(width: maxSize, height: maxSize)
                  let time = CMTime(seconds: t, preferredTimescale: 600)
                  if let cg = try? gen.copyCGImage(at: time, actualTime: nil) { return UIImage(cgImage: cg) }
                  return nil
              }

              /// يستخرج فريمات الفيديو بمعدل ثابت 15 فريم/ث ويطبق التحويل مباشرة (لتوفير الذاكرة)
              static func videoFrames(url: URL, start: Double, length: Double, transform: (UIImage) -> UIImage) -> [UIImage] {
                  let gen = AVAssetImageGenerator(asset: AVURLAsset(url: url))
                  gen.appliesPreferredTrackTransform = true
                  gen.maximumSize = CGSize(width: 768, height: 768)
                  gen.requestedTimeToleranceBefore = .zero
                  gen.requestedTimeToleranceAfter = .zero
                  let n = min(150, max(2, Int(length * videoFPS)))
                  var frames: [UIImage] = []
                  for i in 0..<n {
                      autoreleasepool {
                          let t = CMTime(seconds: start + Double(i) / videoFPS, preferredTimescale: 600)
                          if let cg = try? gen.copyCGImage(at: t, actualTime: nil) {
                              frames.append(transform(UIImage(cgImage: cg)))
                          } else if let last = frames.last {
                              frames.append(last)
                          }
                      }
                  }
                  return frames
              }

              static func resample(_ img: UIImage, _ s: CGFloat) -> UIImage {
                  let small = CGSize(width: 512 * s, height: 512 * s)
                  let f = UIGraphicsImageRendererFormat(); f.scale = 1; f.opaque = false
                  let a = UIGraphicsImageRenderer(size: small, format: f).image { _ in
                      img.draw(in: CGRect(origin: .zero, size: small))
                  }
                  return UIGraphicsImageRenderer(size: CGSize(width: 512, height: 512), format: f).image { _ in
                      a.draw(in: CGRect(x: 0, y: 0, width: 512, height: 512))
                  }
              }

              private static func encodeOnce(_ frames: [UIImage], _ durs: [Double], _ q: Double) -> Data? {
                  let opts: [SDImageCoderOption: Any] = [.encodeCompressionQuality: q]
                  if frames.count > 1 {
                      var fr: [SDImageFrame] = []
                      for (i, f) in frames.enumerated() {
                          fr.append(SDImageFrame(image: f, duration: max(0.02, durs[i])))
                      }
                      guard let anim = SDImageCoderHelper.animatedImage(with: fr) else { return nil }
                      return SDImageWebPCoder.shared.encodedData(with: anim, format: .webP, options: opts)
                  }
                  return SDImageWebPCoder.shared.encodedData(with: frames[0], format: .webP, options: opts)
              }

              /// ضغط ذكي: كل الفريمات تبقى، والدقة والجودة تنزل تدريجياً لين يدخل حد واتساب (ثابت 100KB / متحرك 500KB)
              static func encode(frames: [UIImage], durations: [Double]) -> Data? {
                  guard !frames.isEmpty, durations.count == frames.count else { return nil }
                  let animated = frames.count > 1
                  let limit = animated ? 500_000 : 100_000
                  let cands: [(CGFloat, Double)] = animated
                      ? [(1, 0.75), (1, 0.55), (1, 0.35), (0.85, 0.5), (0.85, 0.3), (0.7, 0.4), (0.7, 0.25), (0.55, 0.3), (0.45, 0.2)]
                      : [(1, 0.9), (1, 0.7), (1, 0.5), (0.85, 0.5), (0.7, 0.4), (0.55, 0.3)]
                  for (s, q) in cands {
                      let fr = s == 1 ? frames : frames.map { resample($0, s) }
                      if animated && fr.count > 30 {
                          // تقدير سريع للحجم قبل الترميز الكامل
                          let n = 20
                          if let p1 = encodeOnce([fr[0]], [durations[0]], q),
                             let pn = encodeOnce(Array(fr.prefix(n)), Array(durations.prefix(n)), q) {
                              let delta = Double(max(0, pn.count - p1.count)) / Double(n - 1)
                              let est = Double(p1.count) + delta * Double(fr.count - 1)
                              if est > Double(limit) * 1.3 { continue }
                          }
                      }
                      if let d = encodeOnce(fr, durations, q), d.count <= limit { return d }
                  }
                  return nil
              }
          }
