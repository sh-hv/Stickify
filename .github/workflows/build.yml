                  var u = linkURL.trimmingCharacters(in: .whitespaces)
                  guard !t.isEmpty, !u.isEmpty else { return }
                  if !u.contains("://") { u = "https://" + u }
                  var l = links
                  l.append(LinkItem(title: t, url: u))
                  saveLinks(l)
              }

              private func handleImport(_ result: Result<URL, Error>) {
                  guard case .success(let url) = result else { return }
                  let ok = url.startAccessingSecurityScopedResource()
                  defer { if ok { url.stopAccessingSecurityScopedResource() } }
                  guard let d = try? Data(contentsOf: url), let n = lib.restore(d) else {
                      info = tr("الملف غير صالح أو تالف", "The file is invalid or corrupted")
                      return
                  }
                  info = tr("تم استرجاع \(n) حزمة", "Restored \(n) pack(s)")
              }
          }
          EOF_FILE
          cat > Sources/Assets.xcassets/Contents.json <<'EOF_FILE'
          {"info":{"author":"xcode","version":1}}
          EOF_FILE
          cat > Sources/Assets.xcassets/AppIcon.appiconset/Contents.json <<'EOF_FILE'
          {"images":[{"filename":"icon.png","idiom":"universal","platform":"ios","size":"1024x1024"}],"info":{"author":"xcode","version":1}}
          EOF_FILE
      - name: App icon
        run: |
          ICON=Sources/Assets.xcassets/AppIcon.appiconset/icon.png
          if [ -f icon.png ]; then
            sips -z 1024 1024 -s format jpeg icon.png --out /tmp/icon.jpg
            sips -s format png /tmp/icon.jpg --out "$ICON"
          else
            swift tools/icon.swift "$ICON" || echo "icon failed"
          fi
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Build unsigned
        run: |
          xcodebuild -project Stickify.xcodeproj -scheme Stickify -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
      - name: Package IPA
        run: |
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/Stickify.app Payload/
          zip -qry Stickify.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: Stickify-ipa
          path: Stickify.ipa
      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Stickify build ${{ github.run_number }}
          files: Stickify.ipa
