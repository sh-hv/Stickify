name: Build IPA
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: App icon
        run: |
          ICON=Sources/Assets.xcassets/AppIcon.appiconset/icon.png
          mkdir -p Sources/Assets.xcassets/AppIcon.appiconset
          if [ -f icon.png ]; then
            sips -z 1024 1024 -s format jpeg icon.png --out /tmp/icon.jpg
            sips -s format png /tmp/icon.jpg --out "$ICON"
          else
            swift tools/icon.swift "$ICON" || echo "icon failed"
          fi
      - name: Logos
        run: |
          for pair in "x-logo:XLogo" "github-logo:GitHubLogo"; do
            src="${pair%%:*}.png"
            name="${pair##*:}"
            if [ -f "$src" ]; then
              d="Sources/Assets.xcassets/$name.imageset"
              mkdir -p "$d"
              cp "$src" "$d/logo.png"
              printf '{"images":[{"filename":"logo.png","idiom":"universal"}],"info":{"author":"xcode","version":1},"properties":{"template-rendering-intent":"template"}}' > "$d/Contents.json"
            fi
          done
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Build unsigned
        run: |
          xcodebuild -project Stickify.xcodeproj -scheme Stickify -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
      - name: Package IPA
        run: |
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/Stickify.app Payload/
          zip -qry Stickify.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: Stickify-ipa
          path: Stickify.ipa
      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Stickify build ${{ github.run_number }}
          files: Stickify.ipa
