                                  Text(tr("لون التطبيق", "Accent color"))
                                  Spacer()
                                  ForEach(0..<Palette.colors.count, id: \.self) { i in
                                      Circle().fill(Palette.colors[i]).frame(width: 28, height: 28)
                                          .overlay(Circle().stroke(Color.primary, lineWidth: accent == i ? 3 : 0))
                                          .onTapGesture { accent = i }
                                  }
                              }
                          }
                          Section(tr("افتراضيات", "Defaults")) {
                              TextField(tr("اسم الناشر الافتراضي", "Default publisher name"), text: $publisher)
                              Picker(tr("إطارات الفيديو بالثانية", "Video frames per second"), selection: $fps) {
                                  ForEach([10, 15, 20, 24], id: \.self) { Text("\($0)").tag($0) }
                              }
                          }
                          Section(tr("حول", "About")) {
                              HStack { Text(tr("الإصدار", "Version")); Spacer(); Text("1.1").foregroundStyle(.secondary) }
                          }
                      }
                      .navigationTitle(tr("الإعدادات", "Settings"))
                      .navigationBarTitleDisplayMode(.inline)
                      .toolbar {
                          ToolbarItem(placement: .topBarTrailing) { Button(tr("تم", "Done")) { dismiss() } }
                      }
                  }
              }
          }
          EOF_FILE
          cat > Sources/Assets.xcassets/Contents.json <<'EOF_FILE'
          {"info":{"author":"xcode","version":1}}
          EOF_FILE
          cat > Sources/Assets.xcassets/AppIcon.appiconset/Contents.json <<'EOF_FILE'
          {"images":[{"filename":"icon.png","idiom":"universal","platform":"ios","size":"1024x1024"}],"info":{"author":"xcode","version":1}}
          EOF_FILE
      - name: Generate app icon
        run: swift tools/icon.swift Sources/Assets.xcassets/AppIcon.appiconset/icon.png || echo "icon failed"
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Build unsigned
        run: |
          xcodebuild -project Stickify.xcodeproj -scheme Stickify -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
      - name: Package IPA
        run: |
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/Stickify.app Payload/
          zip -qry Stickify.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: Stickify-ipa
          path: Stickify.ipa
      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Stickify build ${{ github.run_number }}
          files: Stickify.ipa
