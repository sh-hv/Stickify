name: Build Stickify IPA
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.4.app
      - name: Build Unsigned IPA
        run: |
          xcodebuild archive \
            -project Stickify.xcodeproj \
            -scheme Stickify \
            -configuration Release \
            -archivePath $PWD/build/Stickify.xcarchive \
            -sdk iphoneos \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""
          mkdir -p Payload
          cp -r build/Stickify.xcarchive/Products/Applications/Stickify.app Payload/
          zip -r Stickify-Unsigned.ipa Payload
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Stickify-IPA
          path: Stickify-Unsigned.ipa
