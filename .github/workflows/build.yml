name: Build IPA
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Create project files
        run: |
          mkdir -p Sources tools Sources/Assets.xcassets/AppIcon.appiconset
          cat > project.yml <<'EOF_FILE'
          name: Stickify
          options:
            bundleIdPrefix: com.stickify
            deploymentTarget:
              iOS: "16.0"
          packages:
            SDWebImage:
              url: https://github.com/SDWebImage/SDWebImage
              from: 5.19.0
            SDWebImageWebPCoder:
              url: https://github.com/SDWebImage/SDWebImageWebPCoder
              from: 0.14.6
          targets:
            Stickify:
              type: application
              platform: iOS
              sources: [Sources]
              dependencies:
                - package: SDWebImage
                  product: SDWebImage
                - package: SDWebImageWebPCoder
                  product: SDWebImageWebPCoder
              info:
                path: Sources/Info.plist
                properties:
                  CFBundleDisplayName: Stickify
                  UILaunchScreen: {}
                  LSApplicationQueriesSchemes: [whatsapp]
                  UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
              settings:
                base:
                  PRODUCT_BUNDLE_IDENTIFIER: com.stickify.app
                  SWIFT_VERSION: "5.0"
                  MARKETING_VERSION: "1.1"
                  CURRENT_PROJECT_VERSION: "2"
                  TARGETED_DEVICE_FAMILY: "1"
                  ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
          EOF_FILE
          cat > tools/icon.swift <<'EOF_FILE'
          import CoreGraphics
          import ImageIO
          import Foundation

          let cs = CGColorSpaceCreateDeviceRGB()
          let ctx = CGContext(data: nil, width: 1024, height: 1024, bitsPerComponent: 8, bytesPerRow: 0, space: cs, bitmapInfo: CGImageAlphaInfo.noneSkipLast.rawValue)!
          let cols = [CGColor(red: 0.16, green: 0.82, blue: 0.56, alpha: 1), CGColor(red: 0.10, green: 0.42, blue: 0.95, alpha: 1)] as CFArray
          let grad = CGGradient(colorsSpace: cs, colors: cols, locations: [0, 1])!
          ctx.drawLinearGradient(grad, start: CGPoint(x: 0, y: 1024), end: CGPoint(x: 1024, y: 0), options: [])
          ctx.saveGState()
          ctx.translateBy(x: 512, y: 512)
          ctx.rotate(by: -0.12)
          ctx.setShadow(offset: CGSize(width: 0, height: -24), blur: 40, color: CGColor(gray: 0, alpha: 0.35))
          ctx.setFillColor(CGColor(gray: 1, alpha: 1))
          ctx.addPath(CGPath(roundedRect: CGRect(x: -300, y: -300, width: 600, height: 600), cornerWidth: 150, cornerHeight: 150, transform: nil))
          ctx.fillPath()
          ctx.setShadow(offset: .zero, blur: 0, color: nil)
          let dark = CGColor(red: 0.10, green: 0.12, blue: 0.20, alpha: 1)
          ctx.setFillColor(dark)
          ctx.fillEllipse(in: CGRect(x: -130, y: 40, width: 70, height: 110))
          ctx.fillEllipse(in: CGRect(x: 60, y: 40, width: 70, height: 110))
          ctx.setStrokeColor(dark)
          ctx.setLineWidth(40)
          ctx.setLineCap(.round)
          ctx.addArc(center: CGPoint(x: 0, y: -10), radius: 150, startAngle: CGFloat.pi * 1.15, endAngle: CGFloat.pi * 1.85, clockwise: false)
          ctx.strokePath()
          ctx.restoreGState()
          let img = ctx.makeImage()!
          let url = URL(fileURLWithPath: CommandLine.arguments[1])
          let dest = CGImageDestinationCreateWithURL(url as CFURL, "public.png" as CFString, 1, nil)!
          CGImageDestinationAddImage(dest, img, nil)
          CGImageDestinationFinalize(dest)
          EOF_FILE
          cat > Sources/StickifyApp.swift <<'EOF_FILE'
          import SwiftUI
          import UIKit
          import SDWebImage
          import SDWebImageWebPCoder

          func tr(_ ar: String, _ en: String) -> String {
              (UserDefaults.standard.string(forKey: "lang") ?? "ar") == "ar" ? ar : en
          }

          enum Palette {
              static let colors: [Color] = [.green, .blue, .purple, .pink, .orange, .teal]
          }

          struct StickerMeta: Codable, Identifiable, Hashable {
              var id: String
              var emojis: [String]
          }

          struct PackMeta: Codable, Identifiable {
              var id: String
              var name: String
              var publisher: String
              var animated: Bool
              var stickers: [StickerMeta]
          }

          final class Library: ObservableObject {
              @Published var packs: [PackMeta] = []
              private let root: URL
              private let cache = NSCache<NSString, UIImage>()

              init() {
                  let d = FileManager.default.urls(for: .documentDirectory, in: .userDomainMask)[0].appendingPathComponent("StickifyLib")
                  try? FileManager.default.createDirectory(at: d, withIntermediateDirectories: true)
                  root = d
                  if let data = try? Data(contentsOf: d.appendingPathComponent("packs.json")),
                     let p = try? JSONDecoder().decode([PackMeta].self, from: data) { packs = p }
              }

              private func persist() {
                  if let d = try? JSONEncoder().encode(packs) {
                      try? d.write(to: root.appendingPathComponent("packs.json"))
                  }
              }

              private func url(_ sid: String) -> URL { root.appendingPathComponent(sid + ".webp") }

              func data(_ sid: String) -> Data? { try? Data(contentsOf: url(sid)) }

              func thumb(_ sid: String) -> UIImage {
                  if let c = cache.object(forKey: sid as NSString) { return c }
                  guard let d = data(sid) else { return UIImage() }
                  let opts: [SDImageCoderOption: Any] = [.decodeFirstFrameOnly: true]
                  let img = SDImageWebPCoder.shared.decodedImage(with: d, options: opts) ?? UIImage()
                  cache.setObject(img, forKey: sid as NSString)
                  return img
              }

              func addPack(name: String, publisher: String, animated: Bool) -> String {
                  let p = PackMeta(id: UUID().uuidString, name: name, publisher: publisher, animated: animated, stickers: [])
                  packs.append(p)
                  persist()
                  return p.id
              }

              func rename(_ id: String, name: String) {
                  guard let i = packs.firstIndex(where: { $0.id == id }) else { return }
                  packs[i].name = name
                  persist()
              }

              func deletePack(_ id: String) {
                  guard let i = packs.firstIndex(where: { $0.id == id }) else { return }
                  for s in packs[i].stickers { try? FileManager.default.removeItem(at: url(s.id)) }
                  packs.remove(at: i)
                  persist()
              }

              func addSticker(_ packID: String, data: Data, emojis: [String]) {
                  guard let i = packs.firstIndex(where: { $0.id == packID }) else { return }
                  let sid = UUID().uuidString
                  try? data.write(to: url(sid))
                  packs[i].stickers.append(StickerMeta(id: sid, emojis: emojis))
                  persist()
              }

              func setEmojis(_ packID: String, _ sid: String, _ emojis: [String]) {
                  guard let i = packs.firstIndex(where: { $0.id == packID }),
                        let j = packs[i].stickers.firstIndex(where: { $0.id == sid }) else { return }
                  packs[i].stickers[j].emojis = emojis
                  persist()
              }

              func deleteSticker(_ packID: String, _ sid: String) {
                  guard let i = packs.firstIndex(where: { $0.id == packID }) else { return }
                  try? FileManager.default.removeItem(at: url(sid))
                  packs[i].stickers.removeAll { $0.id == sid }
                  persist()
              }
          }

          enum WhatsApp {
              static func send(_ pack: PackMeta, lib: Library) -> String? {
                  guard pack.stickers.count >= 3 else {
                      return tr("لازم 3 ستيكرات على الأقل (الحد الأقصى 30)", "You need at least 3 stickers (max 30)")
                  }
                  guard let wa = URL(string: "whatsapp://stickerPack"), UIApplication.shared.canOpenURL(wa) else {
                      return tr("واتساب غير مثبت على الجهاز", "WhatsApp is not installed")
                  }
                  let list = Array(pack.stickers.prefix(30))
                  let side: CGFloat = 96
                  let fmt = UIGraphicsImageRendererFormat(); fmt.scale = 1; fmt.opaque = false
                  let first = lib.thumb(list[0].id)
                  let tray = UIGraphicsImageRenderer(size: CGSize(width: side, height: side), format: fmt).image { _ in
                      first.draw(in: CGRect(x: 0, y: 0, width: side, height: side))
                  }
                  guard let trayPNG = tray.pngData() else { return tr("فشل إنشاء أيقونة الحزمة", "Failed to create tray icon") }
                  var items: [[String: Any]] = []
                  for s in list {
                      guard let d = lib.data(s.id) else { continue }
                      let em = s.emojis.isEmpty ? ["😀"] : Array(s.emojis.prefix(3))
                      items.append(["image_data": d.base64EncodedString(), "emojis": em])
                  }
                  let json: [String: Any] = [
                      "identifier": pack.id + "." + String(list.count),
                      "name": pack.name,
                      "publisher": pack.publisher,
                      "tray_image": trayPNG.base64EncodedString(),
                      "is_animated_sticker_pack": pack.animated,
                      "stickers": items
                  ]
                  guard let data = try? JSONSerialization.data(withJSONObject: json) else {
                      return tr("فشل تجهيز البيانات", "Failed to prepare data")
                  }
                  UIPasteboard.general.setItems(
                      [["net.whatsapp.third-party.sticker-pack": data]],
                      options: [.localOnly: true, .expirationDate: Date(timeIntervalSinceNow: 60)]
                  )
                  UIApplication.shared.open(wa)
                  return nil
              }
          }

          @main
          struct StickifyApp: App {
              @StateObject private var lib = Library()
              @AppStorage("lang") private var lang = "ar"
              @AppStorage("theme") private var theme = 0
              @AppStorage("accent") private var accent = 0

              init() { SDImageCodersManager.shared.addCoder(SDImageWebPCoder.shared) }

              var body: some Scene {
                  WindowGroup {
                      HomeView()
                          .id(lang)
                          .environmentObject(lib)
                          .environment(\.layoutDirection, lang == "ar" ? .rightToLeft : .leftToRight)
                          .tint(Palette.colors[min(accent, Palette.colors.count - 1)])
                          .preferredColorScheme(theme == 1 ? .light : (theme == 2 ? .dark : nil))
                  }
              }
          }
          EOF_FILE
          cat > Sources/Imaging.swift <<'EOF_FILE'
          import UIKit
          import Vision
          import CoreImage
          import ImageIO
          import AVFoundation
          import SDWebImage
          import SDWebImageWebPCoder

          enum Effect: String, CaseIterable, Identifiable {
              case bounce, shake, pulse, spin, wobble, float
              var id: String { rawValue }
              var title: String {
                  switch self {
                  case .bounce: return tr("قفز", "Bounce")
                  case .shake: return tr("اهتزاز", "Shake")
                  case .pulse: return tr("نبض", "Pulse")
                  case .spin: return tr("دوران", "Spin")
                  case .wobble: return tr("تمايل", "Wobble")
                  case .float: return tr("طفو", "Float")
                  }
              }

              func transform(_ p: Double) -> (dx: CGFloat, dy: CGFloat, s: CGFloat, a: CGFloat) {
                  let t = p * 2 * Double.pi
                  switch self {
                  case .bounce: return (0, -CGFloat(abs(sin(t))) * 60, 1, 0)
                  case .shake:  return (CGFloat(sin(t * 3)) * 30, 0, 1, 0)
                  case .pulse:  return (0, 0, 1 + 0.15 * CGFloat(sin(t)), 0)
                  case .spin:   return (0, 0, 0.8, CGFloat(t))
                  case .wobble: return (0, 0, 1, CGFloat(sin(t)) * 0.25)
                  case .float:  return (0, CGFloat(sin(t)) * 25, 1 + 0.04 * CGFloat(sin(t)), 0)
                  }
              }

              func frames(_ base: UIImage, count: Int = 20) -> [UIImage] {
                  let fmt = UIGraphicsImageRendererFormat(); fmt.scale = 1; fmt.opaque = false
                  let r = UIGraphicsImageRenderer(size: CGSize(width: 512, height: 512), format: fmt)
                  return (0..<count).map { i in
                      let t = transform(Double(i) / Double(count))
                      return r.image { ctx in
                          let c = ctx.cgContext
                          c.translateBy(x: 256 + t.dx, y: 256 + t.dy)
                          c.rotate(by: t.a)
                          c.scaleBy(x: t.s * 0.8, y: t.s * 0.8)
                          base.draw(in: CGRect(x: -256, y: -256, width: 512, height: 512))
                      }
                  }
              }
          }

          enum Imaging {
              static func normalize(_ img: UIImage, maxDim: CGFloat = 1280) -> UIImage {
                  let s = min(1, maxDim / max(img.size.width, img.size.height))
                  let size = CGSize(width: img.size.width * s, height: img.size.height * s)
                  let fmt = UIGraphicsImageRendererFormat(); fmt.scale = 1; fmt.opaque = false
                  return UIGraphicsImageRenderer(size: size, format: fmt).image { _ in
                      img.draw(in: CGRect(origin: .zero, size: size))
                  }
              }

              static func removeBackground(_ img: UIImage) -> UIImage? {
                  guard #available(iOS 17.0, *), let cg = img.cgImage else { return nil }
                  let req = VNGenerateForegroundInstanceMaskRequest()
                  let handler = VNImageRequestHandler(cgImage: cg)
                  do {
                      try handler.perform([req])
                      guard let obs = req.results?.first else { return nil }
                      let buf = try obs.generateMaskedImage(ofInstances: obs.allInstances, from: handler, croppedToInstancesExtent: false)
                      let ci = CIImage(cvPixelBuffer: buf)
                      guard let out = CIContext().createCGImage(ci, from: ci.extent) else { return nil }
                      return UIImage(cgImage: out)
                  } catch { return nil }
              }

              static func gifFrames(_ data: Data) -> (frames: [UIImage], delays: [Double])? {
                  guard let src = CGImageSourceCreateWithData(data as CFData, nil) else { return nil }
                  let n = CGImageSourceGetCount(src)
                  guard n > 1 else { return nil }
                  var frames: [UIImage] = []
                  var delays: [Double] = []
                  let opts: [CFString: Any] = [
                      kCGImageSourceCreateThumbnailFromImageAlways: true,
                      kCGImageSourceCreateThumbnailWithTransform: true,
                      kCGImageSourceThumbnailMaxPixelSize: 768
                  ]
                  for i in 0..<min(n, 150) {
                      guard let cg = CGImageSourceCreateThumbnailAtIndex(src, i, opts as CFDictionary) else { continue }
                      let props = CGImageSourceCopyPropertiesAtIndex(src, i, nil) as? [CFString: Any]
                      let g = props?[kCGImagePropertyGIFDictionary] as? [CFString: Any]
                      let d = (g?[kCGImagePropertyGIFUnclampedDelayTime] as? Double) ?? (g?[kCGImagePropertyGIFDelayTime] as? Double) ?? 0.1
                      frames.append(UIImage(cgImage: cg))
                      delays.append(max(0.02, d))
                  }
                  return frames.isEmpty ? nil : (frames, delays)
              }

              static func videoFrame(url: URL, at t: Double) -> UIImage? {
                  let gen = AVAssetImageGenerator(asset: AVURLAsset(url: url))
                  gen.appliesPreferredTrackTransform = true
                  gen.maximumSize = CGSize(width: 1024, height: 1024)
                  let time = CMTime(seconds: t, preferredTimescale: 600)
                  if let cg = try? gen.copyCGImage(at: time, actualTime: nil) { return UIImage(cgImage: cg) }
                  return nil
              }

              static func videoFrames(url: URL, start: Double, length: Double, fps: Double) -> [UIImage] {
                  let gen = AVAssetImageGenerator(asset: AVURLAsset(url: url))
                  gen.appliesPreferredTrackTransform = true
                  gen.maximumSize = CGSize(width: 768, height: 768)
                  gen.requestedTimeToleranceBefore = .zero
                  gen.requestedTimeToleranceAfter = .zero
                  let n = min(150, max(1, Int(length * fps)))
                  var frames: [UIImage] = []
                  for i in 0..<n {
                      let t = CMTime(seconds: start + Double(i) / fps, preferredTimescale: 600)
                      if let cg = try? gen.copyCGImage(at: t, actualTime: nil) {
                          frames.append(UIImage(cgImage: cg))
                      } else if let last = frames.last {
                          frames.append(last)
                      }
                  }
                  return frames
              }

              static func resample(_ img: UIImage, _ s: CGFloat) -> UIImage {
                  let small = CGSize(width: 512 * s, height: 512 * s)
                  let f = UIGraphicsImageRendererFormat(); f.scale = 1; f.opaque = false
                  let a = UIGraphicsImageRenderer(size: small, format: f).image { _ in
                      img.draw(in: CGRect(origin: .zero, size: small))
                  }
                  return UIGraphicsImageRenderer(size: CGSize(width: 512, height: 512), format: f).image { _ in
                      a.draw(in: CGRect(x: 0, y: 0, width: 512, height: 512))
                  }
              }

              private static func encodeOnce(_ frames: [UIImage], _ durs: [Double], _ q: Double) -> Data? {
                  let opts: [SDImageCoderOption: Any] = [.encodeCompressionQuality: q]
                  if frames.count > 1 {
                      var fr: [SDImageFrame] = []
                      for (i, f) in frames.enumerated() {
                          fr.append(SDImageFrame(image: f, duration: max(0.02, durs[i])))
                      }
                      guard let anim = SDImageCoderHelper.animatedImage(with: fr) else { return nil }
                      return SDImageWebPCoder.shared.encodedData(with: anim, format: .webP, options: opts)
                  }
                  return SDImageWebPCoder.shared.encodedData(with: frames[0], format: .webP, options: opts)
              }

              /// ضغط ذكي: يحافظ على كل الفريمات ويضحي بالدقة تدريجياً (ثابت < 100KB ، متحرك < 500KB)
              static func encode(frames: [UIImage], durations: [Double]) -> Data? {
                  guard !frames.isEmpty, durations.count == frames.count else { return nil }
                  let animated = frames.count > 1
                  let limit = animated ? 500_000 : 100_000
                  let qs: [Double] = animated ? [0.7, 0.45, 0.25] : [0.9, 0.7, 0.45, 0.25]
                  for s in [1.0, 0.8, 0.6] as [CGFloat] {
                      let fr = s == 1 ? frames : frames.map { resample($0, s) }
                      for q in qs {
                          if let d = encodeOnce(fr, durations, q), d.count < limit { return d }
                      }
                  }
                  if animated && frames.count > 12 {
                      let idx = Array(stride(from: 0, to: frames.count, by: 2))
                      return encode(frames: idx.map { frames[$0] }, durations: idx.map { durations[$0] * 2 })
                  }
                  return nil
              }
          }
          EOF_FILE
          cat > Sources/Editor.swift <<'EOF_FILE'
          import SwiftUI
          import PhotosUI
          import AVFoundation
          import UniformTypeIdentifiers
          import SDWebImage

          enum Source {
              case image(UIImage)
              case gif([UIImage], [Double])
              case video(URL)
          }

          struct EditJob: Identifiable {
              let id = UUID()
              let source: Source
          }

          struct Movie: Transferable {
              let url: URL
              static var transferRepresentation: some TransferRepresentation {
                  FileRepresentation(contentType: .movie) { movie in
                      SentTransferredFile(movie.url)
                  } importing: { received in
                      let dst = FileManager.default.temporaryDirectory.appendingPathComponent(UUID().uuidString + ".mov")
                      try FileManager.default.copyItem(at: received.file, to: dst)
                      return Movie(url: dst)
                  }
              }
          }

          enum CropShape: CaseIterable, Identifiable {
              case square, r43, r34, r169, r916, free
              var id: Self { self }
              var title: String {
                  switch self {
                  case .square: return tr("مربع", "Square")
                  case .r43: return "4:3"
                  case .r34: return "3:4"
                  case .r169: return "16:9"
                  case .r916: return "9:16"
                  case .free: return tr("مخصص", "Free")
                  }
              }
              var ratio: CGFloat? {
                  switch self {
                  case .square: return 1
                  case .r43: return 4.0 / 3.0
                  case .r34: return 3.0 / 4.0
                  case .r169: return 16.0 / 9.0
                  case .r916: return 9.0 / 16.0
                  case .free: return nil
                  }
              }
              func rect(_ S: CGFloat) -> CGRect {
                  guard let r = ratio else { return CGRect(x: 0, y: 0, width: S, height: S) }
                  var w = S, h = S
                  if r >= 1 { h = S / r } else { w = S * r }
                  return CGRect(x: (S - w) / 2, y: (S - h) / 2, width: w, height: h)
              }
          }

          struct EditParams {
              var S: CGFloat
              var scale: CGFloat = 1
              var offset: CGSize = .zero
              var shape: CropShape = .square
              var lasso: [CGPoint] = []
              var text: String = ""
              var textColor: Color = .white
              var textSize: CGFloat = 56
              var textPos: CGPoint = CGPoint(x: 0.5, y: 0.8)

              func render(_ src: UIImage) -> UIImage {
                  let k = 512 / S
                  let f = UIGraphicsImageRendererFormat(); f.scale = 1; f.opaque = false
                  return UIGraphicsImageRenderer(size: CGSize(width: 512, height: 512), format: f).image { ctx in
                      let c = ctx.cgContext
                      c.saveGState()
                      if shape == .free {
                          if lasso.count > 2 {
                              let path = CGMutablePath()
                              path.move(to: CGPoint(x: lasso[0].x * k, y: lasso[0].y * k))
                              for pt in lasso.dropFirst() { path.addLine(to: CGPoint(x: pt.x * k, y: pt.y * k)) }
                              path.closeSubpath()
                              c.addPath(path)
                              c.clip()
                          }
                      } else {
                          let r = shape.rect(S)
                          c.clip(to: CGRect(x: r.minX * k, y: r.minY * k, width: r.width * k, height: r.height * k))
                      }
                      c.translateBy(x: 256 + offset.width * k, y: 256 + offset.height * k)
                      c.scaleBy(x: scale, y: scale)
                      let s = min(512 / src.size.width, 512 / src.size.height)
                      let w = src.size.width * s, h = src.size.height * s
                      src.draw(in: CGRect(x: -w / 2, y: -h / 2, width: w, height: h))
                      c.restoreGState()
                      if !text.isEmpty {
                          let font = UIFont.systemFont(ofSize: textSize * k, weight: .heavy)
                          let attrs: [NSAttributedString.Key: Any] = [
                              .font: font,
                              .foregroundColor: UIColor(textColor),
                              .strokeColor: UIColor.black,
                              .strokeWidth: -6
                          ]
                          let str = NSAttributedString(string: text, attributes: attrs)
                          let sz = str.size()
                          str.draw(at: CGPoint(x: textPos.x * 512 - sz.width / 2, y: textPos.y * 512 - sz.height / 2))
                      }
                  }
              }
          }

          struct CropDim: Shape {
              var shape: CropShape
              var S: CGFloat
              var lasso: [CGPoint]
              func path(in rect: CGRect) -> Path {
                  var p = Path()
                  p.addRect(rect)
                  if shape == .free {
                      guard lasso.count > 2 else { return Path() }
                      p.move(to: lasso[0])
                      for pt in lasso.dropFirst() { p.addLine(to: pt) }
                      p.closeSubpath()
                  } else {
                      p.addRect(shape.rect(S))
                  }
                  return p
              }
          }

          struct EditCanvas: View {
              let image: UIImage
              @Binding var p: EditParams
              var drawing: Bool
              @GestureState private var pinch: CGFloat = 1
              @GestureState private var drag: CGSize = .zero
              @State private var isDrawing = false

              var body: some View {
                  let S = p.S
                  let move = DragGesture()
                      .updating($drag) { v, s, _ in s = v.translation }
                      .onEnded { v in
                          p.offset = CGSize(width: p.offset.width + v.translation.width,
                                            height: p.offset.height + v.translation.height)
                      }
                  let zoom = MagnificationGesture()
                      .updating($pinch) { v, s, _ in s = v }
                      .onEnded { v in p.scale = min(8, max(0.2, p.scale * v)) }
                  ZStack {
                      Rectangle().fill(Color.gray.opacity(0.18))
                      Image(uiImage: image).resizable().scaledToFit().frame(width: S, height: S)
                          .scaleEffect(p.scale * pinch)
                          .offset(x: p.offset.width + drag.width, y: p.offset.height + drag.height)
                      CropDim(shape: p.shape, S: S, lasso: p.lasso)
                          .fill(Color.black.opacity(0.55), style: FillStyle(eoFill: true))
                          .allowsHitTesting(false)
                      outline
                      if !p.text.isEmpty { textView(S) }
                      if drawing { Color.clear.contentShape(Rectangle()).gesture(lassoGesture) }
                  }
                  .frame(width: S, height: S)
                  .clipped()
                  .coordinateSpace(name: "canvas")
                  .gesture(move.simultaneously(with: zoom), including: drawing ? .none : .all)
              }

              @ViewBuilder private var outline: some View {
                  if p.shape == .free {
                      Path { path in
                          if let f = p.lasso.first {
                              path.move(to: f)
                              for pt in p.lasso.dropFirst() { path.addLine(to: pt) }
                              if p.lasso.count > 2 { path.closeSubpath() }
                          }
                      }
                      .stroke(Color.white, style: StrokeStyle(lineWidth: 2, dash: [6, 4]))
                      .allowsHitTesting(false)
                  } else {
                      Path(p.shape.rect(p.S)).stroke(Color.white.opacity(0.9), lineWidth: 1.5).allowsHitTesting(false)
                  }
              }

              private var lassoGesture: some Gesture {
                  DragGesture(minimumDistance: 0, coordinateSpace: .named("canvas"))
                      .onChanged { v in
                          if !isDrawing { isDrawing = true; p.lasso = [] }
                          if let l = p.lasso.last, hypot(l.x - v.location.x, l.y - v.location.y) < 4 { return }
                          p.lasso.append(v.location)
                      }
                      .onEnded { _ in isDrawing = false }
              }

              private func textView(_ S: CGFloat) -> some View {
                  Text(p.text)
                      .font(.system(size: p.textSize, weight: .heavy))
                      .foregroundColor(p.textColor)
                      .shadow(color: .black, radius: 1)
                      .shadow(color: .black, radius: 1)
                      .fixedSize()
                      .gesture(
                          DragGesture(coordinateSpace: .named("canvas")).onChanged { v in
                              p.textPos = CGPoint(x: min(1, max(0, v.location.x / S)),
                                                  y: min(1, max(0, v.location.y / S)))
                          }
                      )
                      .position(x: p.textPos.x * S, y: p.textPos.y * S)
              }
          }

          struct AnimView: UIViewRepresentable {
              let data: Data
              func makeUIView(context: Context) -> SDAnimatedImageView {
                  let v = SDAnimatedImageView()
                  v.contentMode = .scaleAspectFit
                  v.setContentCompressionResistancePriority(.defaultLow, for: .horizontal)
                  v.setContentCompressionResistancePriority(.defaultLow, for: .vertical)
                  v.image = SDAnimatedImage(data: data)
                  return v
              }
              func updateUIView(_ v: SDAnimatedImageView, context: Context) {}
          }

